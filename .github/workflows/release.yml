name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Prepare synchronized release version
        run: bun scripts/release/release.ts "${GITHUB_REF_NAME#v}" --prepare
      - run: bun run build
      - run: bun scripts/tools/link-local-core.ts
      # O core ainda não existe no registry neste ponto. Os lockfiles das
      # integrações serão regenerados depois que o core for publicado.
      - name: Validate release before publishing core
        run: bun run check
        env:
          EMPILHA_RELEASE_SKIP_LOCKFILES: "1"
      - name: Configure npm provenance
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish core with provenance
        run: npm publish --provenance --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
      - name: Regenerate lockfiles after publishing core
        run: bun run release:locks
      - name: Persist synchronized lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/jwt/bun.lock packages/pg/bun.lock scaffold/bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync release ${GITHUB_REF_NAME#v} lockfiles [skip ci]"
            git push origin HEAD:main
          fi
      - name: Validate synchronized release
        run: bun run release:validate
      - name: Publish JWT with provenance
        working-directory: packages/jwt
        run: npm publish --provenance --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
      - name: Publish PostgreSQL with provenance
        working-directory: packages/pg
        run: npm publish --provenance --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
      - name: Publish scaffold with provenance
        working-directory: scaffold
        run: npm publish --provenance --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
