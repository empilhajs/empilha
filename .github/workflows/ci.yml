name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "16", "17"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun scripts/tools/link-local-core.ts
      - name: Run checks
        run: bun run check
        env:
          # O commit de preparação atualiza os manifests antes de o release
          # publicar o core e regenerar os lockfiles das integrações.
          EMPILHA_RELEASE_SKIP_LOCKFILES: ${{ (startsWith(github.event.head_commit.message, 'chore: prepare release ') || startsWith(github.event.head_commit.message, 'ci: allow release preparation lockfiles')) && '1' || '0' }}
      - name: Smoke test migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/empilha_ci
        run: |
          migration_dir="$(mktemp -d)"
          trap 'rm -rf "$migration_dir"' EXIT
          printf 'CREATE TABLE ci_migration_probe (id integer PRIMARY KEY);\n' > "$migration_dir/001_probe.sql"
          bun scripts/database/migrate.ts --dir="$migration_dir"
          bun scripts/database/migrate.ts --dir="$migration_dir"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT 1 FROM empilha_migrations WHERE name = '001_probe.sql'"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun scripts/tools/link-local-core.ts
      - run: bun run check:code
      - run: bun run check:bun
      - run: bun run check:tests
      - run: bun run check:consumer
