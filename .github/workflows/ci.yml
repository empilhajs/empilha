name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun install --cwd packages/jwt --frozen-lockfile
      - run: bun install --cwd packages/pg --frozen-lockfile
      - run: bun install --cwd scaffold --frozen-lockfile
      - run: bun run check
      - name: Smoke test migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/empilha_ci
        run: |
          migration_dir="$(mktemp -d)"
          trap 'rm -rf "$migration_dir"' EXIT
          printf 'CREATE TABLE ci_migration_probe (id integer PRIMARY KEY);\n' > "$migration_dir/001_probe.sql"
          bun scripts/migrate.ts --dir="$migration_dir"
          bun scripts/migrate.ts --dir="$migration_dir"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT 1 FROM empilha_migrations WHERE name = '001_probe.sql'"
